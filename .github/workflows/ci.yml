name: CI

on:
  push:
    branches: [master, 'refonte/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    env:
      # Reads the private @run-iq packages (org secret: classic PAT, read:packages).
      NODE_AUTH_TOKEN: ${{ secrets.RUN_IQ_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://npm.pkg.github.com
          scope: '@run-iq'
          cache: npm
      # A pull request into refonte/<name>, or a push to it, is checked against the branch of the
      # same name of the sibling Run-IQ packages (spec core), not against the
      # published ones (the registry has no version matching these ranges). They are built in the
      # runner, left out of this repository's install (the runner's copy of package.json and
      # package-lock.json only) and linked in place. A missing branch fails the run.
      - name: Install against the sibling branches
        if: startsWith(github.base_ref || github.ref_name, 'refonte/')
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: bash .github/scripts/link-refonte.sh "$BRANCH" spec core
      - name: Install from the published packages
        if: ${{ !startsWith(github.base_ref || github.ref_name, 'refonte/') }}
        run: npm ci
      - name: Typecheck (baseline failure, Task 13)
        id: typecheck
        # Baseline failure, listed in the pull request that added this workflow; Task 13 makes it green.
        continue-on-error: true
        run: npm run typecheck
      - name: Say that the typecheck failed
        if: steps.typecheck.outcome == 'failure'
        run: echo "::warning::Typecheck fails at the baseline (Task 13 makes it green); see the pull request that added this workflow."
      - name: Lint
        id: lint
        run: npm run lint
      - name: Prettier on CLAUDE.md and this workflow
        id: prettier
        run: npm exec --no -- prettier --check CLAUDE.md .github/workflows/ci.yml
      - name: Test
        id: test
        run: npm test
      - name: Build (baseline failure, Task 13)
        id: build
        # Baseline failure, listed in the pull request that added this workflow; Task 13 makes it green.
        continue-on-error: true
        run: npm run build
      - name: Say that the build failed
        if: steps.build.outcome == 'failure'
        run: echo "::warning::Build fails at the baseline (Task 13 makes it green); see the pull request that added this workflow."
